playerwipe:
  # /playerwipe <player> - reset shards, money, stats, playtime or homes.
  #
  # NOTE: this file used to contain TWO 'playerwipe:' blocks. YAML keeps only
  # the last one, and that one had no categories, which is why the menu opened
  # empty. There must be exactly one.
  enabled: true

  # Access is granted by gildedcore.playerwipe or a case-insensitive name below.
  allowed-usernames:
    - sonionviro
    - mtyri
  # Legacy compatibility: a non-blank owner-name is also accepted.
  owner-name: ""
  gui-title: '&8Wipe &8| &f%player%'

  # %player% %stat% %value% are substituted.
  stat-command: 'statsmgr set %player% %stat% %value%'

  # MIRROR EVERY WIPE TO DISCORD.
  #
  # A wipe is destructive and cannot be undone, so the record belongs somewhere
  # staff cannot quietly delete - which is the whole reason to log it off-server
  # rather than only to console.
  #
  # Needs DiscordSRV installed. With it absent this does nothing and says
  # nothing. 'channel' is a DiscordSRV GAME channel name, the left-hand side of
  # its channels map, not a Discord channel ID.
  discord-log:
    enabled: true
    channel: 'staff'

  # Each category is a button. Keys:
  #   slot / icon / display-name / description / information / warning
  #   amounts        true = offer preset and custom amounts as well as a reset
  #   amount-presets the preset buttons
  #   all-commands   run for "reset all"
  #   take-commands  run for a specific amount, %amount% is substituted
  #   stats          non-empty turns this category into a per-counter menu
  categories:
    shards:
      enabled: true
      slot: 10
      icon: AMETHYST_SHARD
      display-name: '&d&lSHARDS'
      description: 'Shard balance'
      information:
        - 'Removes shards from this account.'
        - 'Reset zeroes the balance; an amount claws back exactly that much.'
      warning: 'This cannot be undone without a backup.'
      amounts: true
      amount-presets: [100, 1000, 10000, 100000]
      all-commands:
        - 'shard reset %player%'
      take-commands:
        - 'shard take %player% %amount%'
    economy:
      enabled: true
      slot: 11
      icon: GOLD_INGOT
      display-name: '&e&lECONOMY'
      description: 'Money balance'
      information:
        - 'Removes money from this account.'
        - 'Reset zeroes the balance; an amount takes exactly that much.'
      warning: 'This cannot be undone without a backup.'
      amounts: true
      amount-presets: [1000, 10000, 100000, 1000000]
      all-commands:
        - 'eco reset %player%'
      take-commands:
        - 'eco take %player% %amount%'
    stats:
      enabled: true
      slot: 12
      icon: PAPER
      display-name: '&b&lSTATS'
      description: 'Individual counters'
      information:
        - 'Pick one counter to zero, or reset every one of them.'
      warning: 'Counters cannot be restored once zeroed.'
      stats:
        - blocks_broken
        - blocks_placed
        - chat_messages
        - kills
        - jumps
        - deaths
        - items_crafted
        - mob_kills
        - money_made
        - money_spent
        - playtime
    playtime:
      enabled: true
      slot: 14
      icon: CLOCK
      display-name: '&#EEBB01&lPLAYTIME'
      description: 'EssentialsX playtime'
      information:
        - 'Resets the playtime EssentialsX has recorded.'
        - 'Note: this also resets progress towards the active rank.'
      warning: 'This cannot be undone.'
      all-commands:
        - 'essentials:playtime reset %player%'

    inventory:
      enabled: true
      slot: 15
      icon: CHEST
      display-name: '&f&lINVENTORY'
      description: 'Everything they are carrying'
      information:
        - 'Empties the main inventory, armour and offhand.'
        - ''
        - 'Vanilla /clear, so it hits what the player has on'
        - 'them right now and nothing in storage.'
      warning: 'Items are destroyed, not dropped. There is no undo.'
      all-commands:
        - 'minecraft:clear %player%'

    enderchest:
      enabled: true
      slot: 16
      icon: ENDER_CHEST
      display-name: '&5&lENDER CHEST'
      description: 'Ender chest and AxVaults'
      information:
        - 'Clears the vanilla ender chest and every AxVaults'
        - 'page the account owns.'
        - ''
        - 'Drop the axvaults line if you do not run AxVaults;'
        - 'an unknown command is logged and skipped, but there'
        - 'is no reason to leave it firing.'
      warning: 'Items are destroyed, not dropped. There is no undo.'
      # The vanilla ender chest is cleared by the plugin directly - /clear only
      # empties the main inventory and never touches it, so a command line alone
      # would have reported success having done nothing. Only AxVaults needs a
      # command. Delete this line if you do not run AxVaults.
      all-commands:
        - 'axvaults clear %player%'
    homes:
      enabled: true
      slot: 15
      icon: COMPASS
      display-name: '&a&lHOMES'
      description: 'EssentialsX homes'
      information:
        - 'Deletes every home this account has set.'
      warning: 'Coordinates are not recoverable afterwards.'
      all-commands:
        - 'essentials:delhome %player% *'
    keys:
      enabled: true
      slot: 16
      icon: TRIPWIRE_HOOK
      display-name: '&3&lKEYS'
      description: 'Crate keys'
      information:
        - 'Takes every crate key this account holds.'
      warning: 'Keys are not refunded.'
      all-commands:
        - 'crate key take %player% all'
    rank:
      enabled: true
      slot: 22
      icon: NAME_TAG
      display-name: '&c&lRANK'
      description: 'Reset to default'
      information:
        - 'Sets the LuckPerms parent group back to default.'
      warning: 'Paid ranks are lost. Off by default on purpose.'
      all-commands:
        - 'lp user %player% parent set default'

  full-wipe:
    enabled: true
    slot: 31
    icon: BARRIER
    display-name: '&4&lRESET ALL'
    description: 'Everything at once'
    information:
      - 'Runs a full reset of every category listed below, in order.'
    # Order the categories run in. Leave empty to run every enabled category.
    categories:
      - shards
      - economy
      - stats
      - keys
      - playtime
      - homes
    # Anything extra to run after the categories.
    all-commands: []

