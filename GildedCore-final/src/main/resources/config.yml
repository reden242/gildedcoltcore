# Each reward command is run by console. Available placeholders:
# %player%, %uuid%, %reward%, %streak% and %hours%.

# ---------------------------------------------------------------------------
# ANTI-AD PIPELINE - layers 2 and 3 of the advertising filter.
#
# Both layers run the same classifier - the Millennium 5 engine redesigned for
# text (antiad.m5.bin, 1.8 MB, trained offline on the server corpus) - inside
# the server process. There is no HTTP call and no second service to keep
# alive.
#
# Layer 2 reads the message on its own. Layer 3 reads it against the player's
# last few lines, which is the only way to catch a pitch spread across several
# messages. Both fail OPEN: a missing model means messages pass, never punish.
anti-ad:
  own-domain: 'play.gildedmc.pro'
  l2:
    enabled: true
    model-resource: '/antiad.m5.bin'
  l3:
    enabled: true
    # always  layer 3 reads EVERY message the regex and layer 2 cleared, so a
    #         pitch split across lines is still caught. It runs in-process, so
    #         this costs a few forward passes and no network time.
    # band    layer 3 only sees messages layer 2 put in the 0.40-0.85 band.
    scan-mode: always
    # How many of the player's previous lines layer 3 is shown.
    context-messages: 5
  log:
    keep-days: 30
