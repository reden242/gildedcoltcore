# Do not edit. GildedCore compares this against the version it ships with and
# adds any missing keys on startup, backing your file up to config-backups/
# first. Your existing values are never changed by that merge.
#
# One caveat: deleting a key does not disable it permanently - the next merge
# will restore it at its default, because a deletion is indistinguishable from
# a key that was never there. Set it to false or empty instead of deleting it.
config-version: 42

tips:
  enabled: true
  interval-seconds: 420
  messages: []

staffmanager:
  # Where /staffcode delivers the code. Requires DiscordSRV; the name is the
  # GAME channel name in DiscordSRV's config, not the Discord channel name.
  #
  # The code is never printed in game. Holding the rank is not enough - you
  # also have to be in the staff channel to read it, which is the two-person
  # property the feature was always described as having but never had, because
  # nothing anywhere wrote a code and every /promote failed.
  #
  # From console (including DiscordSRV's console relay) the code IS printed,
  # since a command run through Discord is already being read in Discord.
  discord-channel: 'staff'
  code-ttl-minutes: 10
  code-ttl-seconds: 300
  allowed-actors:
    - owner
    - co-owner
    - executive
    - dev
    - manager
  ladder:
    - member
    - helper
    - jrmod
    - mod
    - srmod
    - jradmin
    - admin
    - sradmin
    - manager
    - executive
    - developer
    - co-owner
    - owner

