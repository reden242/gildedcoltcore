settings:
  title: "&8BillFord Set Trades"
  random-command: "billford"
  set-mode-message: "&fSet trades enabled. Use &e/billfordtoggle &fto go back to random trades."
  random-mode-message: "&fRandom trades enabled."
  no-items-message: "&cYou do not have the required recipe items."
  inventory-full-message: "&cYour inventory is full."
  bought-message: "&fTraded for &e%item%&f."

multitool-sell-values:
  COBBLESTONE: 2
  STONE: 3
  DEEPSLATE: 3
  NETHERRACK: 1
  OAK_LOG: 8
  SPRUCE_LOG: 8
  BIRCH_LOG: 8
  JUNGLE_LOG: 8
  ACACIA_LOG: 8
  DARK_OAK_LOG: 8
  DIAMOND: 300
  EMERALD: 120
  IRON_INGOT: 20
  GOLD_INGOT: 28
  COAL: 8
