trades:
  drill:
    slot: 10
    material: NETHERITE_PICKAXE
    name: "&bDrill"
    give-command: "mythictools give %player% drill 1"
    lore:
      - "&7BillFord drill tool."
      - "&7Mines fast and becomes part"
      - "&7of the Multitool recipe."
    enchants:
      efficiency: 5
      fortune: 3
      unbreaking: 3
      mending: 1
    ingredients:
      1:
        material: NETHERITE_PICKAXE
        amount: 1
      2:
        material: DIAMOND_BLOCK
        amount: 4
      3:
        material: AMETHYST_SHARD
        amount: 32
  tree_chopper:
    slot: 12
    material: NETHERITE_AXE
    name: "&aTree Chopper"
    give-command: "mythictools give %player% tree_chopper 1"
    lore:
      - "&7A heavy netherite axe for"
      - "&7woodcutting and axe PvP."
    enchants:
      efficiency: 5
      sharpness: 5
      unbreaking: 3
      mending: 1
    ingredients:
      1:
        material: NETHERITE_AXE
        amount: 1
      2:
        material: OAK_LOG
        amount: 64
      3:
        material: EMERALD_BLOCK
        amount: 4
  sell_axe:
    slot: 14
    material: NETHERITE_AXE
    name: "&#00ff00Sell Axe"
    give-command: "mythictools give %player% sell_axe 1"
    lore:
      - "&7Netherite BillFord sell axe."
      - "&7Used as part of the Multitool recipe."
    enchants:
      efficiency: 5
      unbreaking: 3
      mending: 1
    ingredients:
      1:
        material: NETHERITE_AXE
        amount: 1
      2:
        material: GOLD_BLOCK
        amount: 8
      3:
        material: NETHERITE_INGOT
        amount: 1
  multitool:
    slot: 16
    material: NETHERITE_PICKAXE
    name: "&dMultitool"
    give-command: "mythictools give %player% multi_tool 1"
    lore:
      - "&7All-in-one BillFord tool."
      - "&7Requires Drill, Tree Chopper,"
      - "&7and Sell Axe."
    enchants:
      efficiency: 5
      fortune: 3
      sharpness: 5
      unbreaking: 3
      mending: 1
    ingredients:
      1:
        material: NETHERITE_PICKAXE
        display-name: "&bDrill"
        amount: 1
      2:
        material: NETHERITE_AXE
        display-name: "&aTree Chopper"
        amount: 1
      3:
        material: NETHERITE_AXE
        display-name: "&#00ff00Sell Axe"
        amount: 1
